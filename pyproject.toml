[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-authority-pki"
version = "0.1.0"
description = "Hierarchical X.509 v3 Certificate Authority, pure stdlib ASN.1 DER parser/encoder, RSA PKCS#1 v1.5 signer, CRL issuer, and OCSP validator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aipd506" }
]
keywords = ["security", "pki", "x509", "ca", "rsa", "asn1", "crl", "ocsp", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.scripts]
enterpriseca = "enterpriseca.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enterpriseca*"]
